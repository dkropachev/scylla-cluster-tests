test_duration: 300

stress_cmd_w: "nosqlbench cql-tabular2 rampup-cycles=1M main-cycles=100M write_ratio=5 read_ratio=5 async=300 --progress console:1s rf=3 partsize=5000 driver=cql-scylla -v"

n_db_nodes: 3
n_loaders: 1
n_monitor_nodes: 1

instance_type_db: 'r5.2xlarge'
instance_type_loader: 'r5.2xlarge'
instance_type_monitor: 't3.small'

user_prefix: 'perf-regression-nosqlbench'
space_node_threshold: 644245094

backtrace_decoding: false

store_perf_results: true
use_mgmt: false
send_email: true
email_recipients: ['d.kropachev@scylladb.com']

data_device: 'attached'
aws_ebs_volume_num: 1
aws_ebs_volume_type: "gp3"
aws_ebs_volume_size: 3072
aws_ebs_volume_iops: 16000
